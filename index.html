<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Videos</title>
    
    <style>
        /* Estilos generales */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ff0000;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* --- ESTILOS DE LA PANTALLA DE BLOQUEO --- */
        #pantalla-bloqueo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-bloqueo {
            background-color: #111111;
            padding: 40px;
            border: 2px solid #ff0000;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        .modal-bloqueo h2 {
            color: #ff0000;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-bloqueo input {
            padding: 12px;
            margin: 20px 0;
            font-size: 18px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ffffff;
            border-radius: 4px;
            text-align: center;
            width: 80%;
            outline: none;
        }

        .modal-bloqueo input:focus {
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .btn-entrar {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .btn-entrar:hover {
            background-color: #cc0000;
        }

        #mensaje-error {
            color: #ff0000;
            margin-top: 15px;
            font-weight: bold;
            display: none; /* Oculto por defecto */
        }

        /* Contenedor principal de la galería (oculto al inicio) */
        #contenido-principal {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* --- ESTILOS DE LA GALERÍA --- */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .video-box {
            flex: 1 1 300px;
            max-width: 380px;
            background-color: #111111;
            border: 2px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }

        .video-label {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-top: 1px solid #ff0000;
        }

        .btn-control {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            margin-top: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .btn-control:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div id="pantalla-bloqueo">
        <div class="modal-bloqueo">
            <h2>Acceso Protegido</h2>
            <input type="password" id="input-pass" placeholder="Ingresa el PIN">
            <button class="btn-entrar" onclick="verificarContrasena()">Desbloquear</button>
            <p id="mensaje-error">Contraseña incorrecta</p>
        </div>
    </div>

    <div id="contenido-principal">
        <h1>Galería PELISJUAN</h1>

        <div class="video-container">
            <div class="video-box">
                <video id="video1" controls poster="klk/portada1.png">
                    <source src="klk/video1.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">SWAT 1</div>
            </div>

            <div class="video-box">
                <video id="video2" controls poster="klk/portada1.png">
                    <source src="klk/video2.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">SWAT 2</div>
            </div>

            <div class="video-box">
               <video id="video3" controls poster="klk/portada2.png">
                    <source src="klk/video3.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">Battleship</div>
            </div>

            <div class="video-box">
                <video id="video4" controls poster="klk/portada3.png">
                    <source src="klk/video4.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">Los Simpson</div>
            </div>

            <div class="video-box">
                <video id="video5" controls poster="klk/portada3.png">
                    <source src="klk/video5.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">Los Simpson</div>
            </div>

            <div class="video-box">
                <video id="video6" controls poster="klk/portada4.png">
                    <source src="klk/video6.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de este video.
                </video>
                <div class="video-label">Troll</div>
            </div>
        </div>

        <button class="btn-control" onclick="detenerVideos()">Pausar Todos los Videos</button>
    </div>

    <script>
        // Lógica para la pantalla de bloqueo
        function verificarContrasena() {
            const input = document.getElementById('input-pass').value;
            const mensajeError = document.getElementById('mensaje-error');
            const pantallaBloqueo = document.getElementById('pantalla-bloqueo');
            const contenidoPrincipal = document.getElementById('contenido-principal');

            if (input === '4455') {
                // Si es correcta, oculta el bloqueo y muestra la galería
                pantallaBloqueo.style.display = 'none';
                contenidoPrincipal.style.display = 'flex';
            } else {
                // Si es incorrecta, muestra el error y limpia el input
                mensajeError.style.display = 'block';
                document.getElementById('input-pass').value = '';
            }
        }

        // Permite presionar "Enter" para enviar la contraseña sin tener que usar el ratón
        document.getElementById("input-pass").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verificarContrasena();
            }
        });

        // Lógica para controlar los 6 videos
        function detenerVideos() {
            for (let i = 1; i <= 6; i++) {
                const video = document.getElementById(`video${i}`);
                if (video) {
                    video.pause();
                }
            }
            console.log("Acción ejecutada: Los 6 videos han sido pausados.");
        }
    </script>

</body>
</html>
